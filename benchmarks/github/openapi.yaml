openapi: 3.0.3
info:
  title: GitHub commit history for git/git
  version: '1'
servers:
  - url: https://api.github.com
paths:
  /repos/git/git/commits:
    get:
      operationId: listCommits
      summary: List commits reachable from a Git revision, optionally limited to a file path
      parameters:
        - {in: query, name: sha, required: true, schema: {type: string}}
        - {in: query, name: path, schema: {type: string}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: One page of GitHub commit records in history order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sha: {type: string}
                    commit:
                      type: object
                      properties:
                        message: {type: string}
